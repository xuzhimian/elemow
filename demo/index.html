<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>饿了喵 · Hungry Meow Demo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%23D99A63'/><circle cx='8' cy='10' r='1.6' fill='%23fff'/><circle cx='11' cy='7' r='1.6' fill='%23fff'/><circle cx='15' cy='7.5' r='1.6' fill='%23fff'/><circle cx='17.5' cy='11' r='1.6' fill='%23fff'/><ellipse cx='12.5' cy='15.5' rx='3.6' ry='3' fill='%23fff'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="7" cy="10" r="2"/><circle cx="11" cy="6.5" r="2"/><circle cx="15.5" cy="7" r="2"/><circle cx="18" cy="11" r="2"/><path d="M8.5 17c0-3 2-5 4-5s4 2 4 5c0 2-2 2.5-4 2.5s-4-.5-4-2.5z"/></svg></span>
          <b>饿了喵</b><small>Hungry Meow · 原型 Demo</small>
        </div>
        <div class="chips">
          <div class="chip phase" id="chip-phase"></div>
          <div class="chip" id="chip-weather"></div>
          <div class="chip coin" id="chip-coins"></div>
          <div class="chip" id="chip-snacks"></div>
        </div>
        <div class="actions">
          <button id="btn-pause" class="btn ghost" title="空格键"></button>
          <button id="btn-speed" class="btn ghost" title="模拟速度">×1</button>
          <button id="btn-station" class="btn">配送站</button>
          <button id="btn-sound" class="btn ghost icon" title="音乐与音效设置" aria-label="音乐与音效设置"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
          <button id="btn-help" class="btn ghost icon" title="站长手册">?</button>
        </div>
      </header>
      <main id="main">
        <section id="map-wrap">
          <div id="map"></div>
          <div id="toasts"></div>
          <div id="hint" hidden>
            <span class="hint-paw"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="7" cy="10" r="2"/><circle cx="11" cy="6.5" r="2"/><circle cx="15.5" cy="7" r="2"/><circle cx="18" cy="11" r="2"/><path d="M8.5 17c0-3 2-5 4-5s4 2 4 5c0 2-2 2.5-4 2.5s-4-.5-4-2.5z"/></svg></span>
            <span id="hint-text"></span>
            <button id="hint-close" class="link">知道了</button>
          </div>
          <div id="pause-veil" hidden><span>已暂停 · 按空格继续</span></div>
          <div id="map-hud">
            <div id="legend">
              <span><i class="lg station"></i>配送站</span>
              <span><i class="lg shop"></i>取货店</span>
              <span><i class="lg cust"></i>顾客</span>
              <span><i class="lg story"></i>熟客</span>
              <span><i class="lg ring"></i>复杂路口</span>
              <span><i class="lg box"></i>纸箱</span>
              <span><i class="lg awning"></i>有遮蔽</span>
            </div>
            <div class="hud-row">
              <div id="compass"><span>N</span></div>
              <div id="scalebar"><div class="bar"></div><span></span></div>
            </div>
          </div>
          <div id="attribution">灰盒示意街区 · 非真实地图数据 · 时间为游戏模拟时间</div>
        </section>
        <aside id="side">
          <div id="side-main">
            <section class="panel orders">
              <h3>待接订单 <span id="pending-count" class="count"></span></h3>
              <div id="order-list"></div>
            </section>
            <section class="panel cats">
              <h3>配送员</h3>
              <div id="cat-list"></div>
            </section>
          </div>
          <div id="dispatch" hidden></div>
        </aside>
      </main>
      <div id="event-card" hidden></div>
      <div id="modal" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
